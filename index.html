<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Status — Service Availability</title>
<meta name="description" content="Real-time availability and 90-day uptime history for Hermes public services: website, OPC API, MRD dashboard, blog and API gateway.">
<meta property="og:title" content="Hermes Status">
<meta property="og:description" content="Real-time availability and 90-day uptime history for Hermes public services.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://status.hermes.cc.cd/">
<link rel="canonical" href="https://status.hermes.cc.cd/">
<script>
/* 首帧主题检测（防闪烁，同步执行）：localStorage gavinlab-theme-v2 优先，
   与官网跨站同步主题偏好；未手动选择时跟随系统 prefers-color-scheme。 */
try {
  var s = localStorage.getItem('gavinlab-theme-v2');
  document.documentElement.setAttribute('data-theme',
    s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
} catch (e) {}
</script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><line x1="16" y1="16" x2="16" y2="6"/><line x1="16" y1="16" x2="24.7" y2="11"/><line x1="16" y1="16" x2="24.7" y2="21"/><line x1="16" y1="16" x2="16" y2="26"/><line x1="16" y1="16" x2="7.3" y2="21"/><line x1="16" y1="16" x2="7.3" y2="11"/><circle cx="16" cy="16" r="3.2" fill="currentColor" stroke="none"/><circle cx="16" cy="6" r="1.8" fill="currentColor" stroke="none"/><circle cx="24.7" cy="11" r="1.8" fill="currentColor" stroke="none"/><circle cx="24.7" cy="21" r="1.8" fill="currentColor" stroke="none"/><circle cx="16" cy="26" r="1.8" fill="currentColor" stroke="none"/><circle cx="7.3" cy="21" r="1.8" fill="currentColor" stroke="none"/><circle cx="7.3" cy="11" r="1.8" fill="currentColor" stroke="none"/></svg>
      <span class="brand-name">Hermes <span class="brand-sub">Status</span></span>
    </div>
    <div class="header-actions">
      <button id="themeBtn" class="theme-btn" type="button" aria-label="Toggle theme"></button>
      <button id="lang-toggle" class="theme-btn" type="button" aria-label="Switch language">中文</button>
    </div>
  </header>

  <!-- Block 1: overall banner -->
  <section id="overall" class="overall overall-unknown" aria-live="polite">
    <div class="overall-inner">
      <span id="overall-dot" class="status-dot dot-unknown" aria-hidden="true"></span>
      <span id="overall-text" data-i18n="collecting">Collecting data…</span>
    </div>
    <div class="overall-meta">
      <span id="generated-at"></span>
      <span class="sep">·</span>
      <span data-i18n="refreshNote">Auto-refreshes every 60s</span>
    </div>
  </section>

  <!-- Block 2: component list -->
  <section>
    <h2 class="section-title" data-i18n="components">Components</h2>
    <div id="component-list" class="component-list"></div>
  </section>

  <!-- Block 3: 90-day uptime history -->
  <section>
    <h2 class="section-title" data-i18n="statusHistory">Uptime history (90 days)</h2>
    <div id="history" class="history"></div>
    <div class="legend">
      <span class="legend-item"><span class="cell st-operational"></span><span data-i18n="operational">Operational</span></span>
      <span class="legend-item"><span class="cell st-degraded"></span><span data-i18n="degraded">Degraded</span></span>
      <span class="legend-item"><span class="cell st-down"></span><span data-i18n="down">Down</span></span>
      <span class="legend-item"><span class="cell st-none"></span><span data-i18n="noData">No data</span></span>
    </div>
  </section>

  <!-- Block 4: incidents -->
  <section>
    <h2 class="section-title" data-i18n="incidents">Incidents</h2>
    <div id="incident-list" class="incident-list"></div>
  </section>

  <footer class="site-footer">
    <a href="https://www.hermes.cc.cd/">hermes.cc.cd</a>
  </footer>
</div>
<script src="./app.js"></script>
</body>
</html>
