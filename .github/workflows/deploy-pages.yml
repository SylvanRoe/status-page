name: Deploy to CF Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 探针 workflow（status-probe）push status.json 的 commit 由 GITHUB_TOKEN 生成，
  # 不会触发 push 事件（GitHub 防循环设计）→ 用 workflow_run 补上自动部署链路
  workflow_run:
    workflows: ["status-probe"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage deploy directory (repo root, exclude tooling)
        run: |
          mkdir -p dist
          # 部署目录 = 仓库根（index.html 在根）；排除探针工具/测试/文档，只留页面静态文件 + status.json
          rsync -a --exclude '.git/' --exclude '.github/' \
            --exclude '*.md' --exclude 'test/' --exclude 'scripts/' \
            --exclude '.gitignore' --exclude 'package*.json' ./ dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist \
            --project-name status-page \
            --branch main \
            --commit-dirty=true
